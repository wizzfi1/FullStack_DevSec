namespace: monitoring

replicaCount: 1

image:
  repository: grafana/grafana
  tag: 11.1.4
  digest: ""
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

securityContext:
  runAsNonRoot: true
  runAsUser: 472
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

admin:
  useExistingSecret: true
  secretName: grafana-admin     # Name of Kubernetes Secret
  # prisma:ignore CKV_SECRET_6
  userKey: admin-user          
  # prisma:ignore CKV_SECRET_6
  passwordKey: admin-password   
  # Actual credentials injected via:
  # kubectl create secret generic grafana-admin \
  #   --from-literal=admin-user=admin \
  #   --from-literal=admin-password=your-super-secret-pass