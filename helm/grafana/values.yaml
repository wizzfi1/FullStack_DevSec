replicaCount: 1

namespace: monitoring

image:
  repository: grafana/grafana
  tag: 11.1.4
  imageDigest: ""   # pin digest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 472   # official Grafana UID
    fsGroup: 472
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

admin:
  existingSecret: grafana-secret
  userKey: admin-user
  passwordKey: admin-password
