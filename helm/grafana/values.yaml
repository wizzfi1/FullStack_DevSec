namespace: monitoring

replicaCount: 1

image:
  repository: grafana/grafana
  tag: 11.1.4
  digest: ""
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

securityContext:
  runAsNonRoot: true
  runAsUser: 472
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

admin:
  useExistingSecret: true
  secretName: "grafana-admin"
  userKey: "adminUser"        # neutral
  passwordKey: "adminPassword" # neutral
