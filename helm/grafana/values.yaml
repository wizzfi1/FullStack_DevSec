image:
  repository: grafana/grafana
  tag: 11.1.4
  imageDigest: ""   # inject at deploy time (helm --set image.imageDigest=sha256:...)
  pullPolicy: Always

replicaCount: 1

admin:
  existingSecret: grafana-secret
  userKey: admin-user
  passKey: admin-password

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

securityContext:
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
