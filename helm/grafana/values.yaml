image:
  repository: grafana/grafana
  tag: 11.1.4
  imageDigest: ""   # inject at deploy time
  pullPolicy: Always

replicaCount: 1

admin:
  existingSecret: ""      # inject with --set admin.existingSecret=grafana-secret
  userKey: ""             # inject with --set admin.userKey=admin-user
  passKey: ""             # inject with --set admin.passKey=admin-password

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
