image:
  repository: grafana/grafana
  tag: 11.1.4
  # Use CI/CD or helm --set to inject the digest, so it's not hardcoded here
  imageDigest: ""   # e.g., set with: helm install mygrafana ./helm/grafana --set image.imageDigest=sha256:abcd123...
  pullPolicy: Always

replicaCount: 1

admin:
  existingSecret: grafana-secret
  userKey: admin-user
  passKey: admin-password

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
