replicaCount: 1

image:
  repository: grafana/grafana
  tag: 11.1.4
  # Replace with actual digest: helm install --set image.imageDigest=sha256:xxxx
  imageDigest: ""

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Sensitive values (admin password injected via Secret, not committed)
adminUser: admin
adminPassword: ""   # set with --set adminPassword or via CI/CD secret
