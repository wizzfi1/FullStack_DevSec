namespace: monitoring

replicaCount: 1

image:
  repository: grafana/grafana
  tag: 11.1.4
  digest: "" # override with immutable digest if desired
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password
