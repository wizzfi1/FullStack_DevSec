# Grafana values.yaml

replicaCount: 1

image:
  repository: grafana/grafana
  tag: 11.1.4
  imageDigest: ""        # optional pinned digest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ "ALL" ]
  seccompProfile:
    type: RuntimeDefault

admin:
  useExistingSecret: true
  secretName: grafana-admin
  userRef: adminUser     
  passRef: adminPassword  
