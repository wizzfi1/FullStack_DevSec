namespace: monitoring

image:
  repository: grafana/grafana
  tag: 11.1.4
  pullPolicy: Always
  digest: "" # optional SHA256 digest

replicaCount: 1

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  runAsUser: 65534
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: grafana-sa
  automountServiceAccountToken: false

admin:
  existingSecret: grafana-admin-secret
