replicaCount: 1

namespace: monitoring

image:
  repository: quay.io/prometheus/alertmanager
  tag: v0.27.0
  imageDigest: ""   # e.g. sha256:abcd1234 (pin image for security)
  pullPolicy: Always

service:
  type: ClusterIP
  port: 9093

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

slack:
  enabled: true
  channel: "#alerts"
  secretName: alertmanager-secret
  secretKey: slackWebhookUrl
