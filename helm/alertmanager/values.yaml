replicaCount: 1

image:
  repository: prom/alertmanager
  tag: v0.27.0
  # Replace with actual digest: helm install --set image.imageDigest=sha256:xxxx
  imageDigest: ""

service:
  type: ClusterIP
  port: 9093

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Slack integration (sensitive webhook is mounted via Secret, not here)
slack:
  channel: "#alerts"
  webhookUrl: ""  # leave empty, passed via Secret at install
