image:
  repository: prom/alertmanager
  tag: v0.27.0
  imageDigest: ""   # inject digest at deploy time
  pullPolicy: Always

replicaCount: 1

slack:
  enabled: true
  existingSecret: ""       # inject with --set slack.existingSecret=alertmanager-secret
  secretKey: ""            # inject with --set slack.secretKey=slack-webhook-url

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

securityContext:
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
