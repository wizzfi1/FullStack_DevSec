namespace: monitoring

image:
  repository: prom/alertmanager
  tag: v0.27.0
  pullPolicy: Always
  digest: "" # optional SHA256 digest

replicaCount: 1

service:
  type: ClusterIP
  port: 9093

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

securityContext:
  runAsUser: 65534
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: alertmanager-sa
  automountServiceAccountToken: false

alertmanagerConfig:
  existingSecret: alertmanager-config-secret
