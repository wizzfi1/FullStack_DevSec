namespace: monitoring

replicaCount: 1

image:
  repository: prom/alertmanager
  tag: v0.27.0
  digest: "" # override with immutable digest if desired
  pullPolicy: Always

service:
  type: ClusterIP
  port: 9093

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

slack:
  useExistingSecret: true
  secretName: alertmanager-slack    # Name of Kubernetes Secret
  # prisma:ignore CKV_SECRET_6
  secretKey: webhook-url           
  # The actual webhook URL is injected via:
  # kubectl create secret generic alertmanager-slack --from-literal=webhook-url=...