apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-notifications
    receivers:
      - name: slack-notifications
        slack_configs:
          - api_url_file: /etc/secrets/alertmanager/{{ .Values.slack.secretKey }}
            channel: "#alerts"
            send_resolved: true
            title: "[{{`{{ .Status | toUpper }}`}}] {{`{{ .GroupLabels.job }}`}} Alerts"
            text: >
              *Alert:* {{`{{ .Annotations.summary }}`}}
              *Description:* {{`{{ .Annotations.description }}`}}
              *Severity:* {{`{{ .Labels.severity }}`}}
              *Time:* {{`{{ .StartsAt }}`}}
