apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: {{ .Values.namespace | default "monitoring" }}
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-notifications
    receivers:
      - name: slack-notifications
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
            channel: {{ .Values.slack.channel | default "#alerts" }}
            send_resolved: true
            title: "[{{ "{{ .Status | toUpper }}" }}] {{ "{{ .GroupLabels.job }}" }} Alerts"
            text: >
              *Alert:* {{ "{{ .Annotations.summary }}" }}
              *Description:* {{ "{{ .Annotations.description }}" }}
              *Severity:* {{ "{{ .Labels.severity }}" }}
              *Time:* {{ "{{ .StartsAt }}" }}
