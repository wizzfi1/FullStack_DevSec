replicaCount: 1

namespace: monitoring

image:
  repository: prom/prometheus
  tag: v2.53.0
  imageDigest: ""   # pin digest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 9090

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

alerting:
  alertmanagerService: alertmanager
  alertmanagerPort: 9093
