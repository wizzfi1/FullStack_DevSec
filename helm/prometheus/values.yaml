replicaCount: 1

image:
  repository: prom/prometheus
  tag: v2.53.0
  # Replace with actual digest: helm install --set image.imageDigest=sha256:xxxx
  imageDigest: ""

service:
  type: ClusterIP
  port: 9090

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Alertmanager integration
alertmanager:
  serviceName: alertmanager
  servicePort: 9093

# Default scrape config (extend as needed)
scrapeConfigs:
  - job_name: "mydev"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "mydev:3000"
