name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test -- --passWithNoTests

      - name: Dependency Audit
        run: npm audit --audit-level=high

      # --- IaC Security Scans ---
      - name: Checkov Scan (IaC security)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .

      - name: Terrascan Scan (IaC security)
        run: |
          echo "🔍 Running Terrascan on supported IaC (Terraform, K8s)..."
          # Restrict to infra/ folder and supported formats only
          terrascan scan -d infra -i terraform -t aws,gcp,azure,k8s || true


      # --- Build + Scan Image ---
      - name: Build Docker Image
        run: docker build -t mydev:${{ github.sha }} .

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mydev:${{ github.sha }}

      - name: Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          IMAGE_NAME=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mydev
          docker tag mydev:${{ github.sha }} $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:${{ github.sha }}
          docker tag mydev:${{ github.sha }} $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-test-scan
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Trigger Render Staging Deploy
        uses: fjogeleit/http-request-action@v1
        with:
          url: "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE }}/deploys"
          method: "POST"
          customHeaders: |
            Accept: application/json
            Authorization: Bearer ${{ secrets.RENDER_API_KEY }}

      - name: Sentry Release (Staging)
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: staging
          version: ${{ github.sha }}
          set_commits: auto

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-test-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Production Deploy
        uses: fjogeleit/http-request-action@v1
        with:
          url: "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_PROD }}/deploys"
          method: "POST"
          customHeaders: |
            Accept: application/json
            Authorization: Bearer ${{ secrets.RENDER_API_KEY }}

      - name: Sentry Release (Production)
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.sha }}
          set_commits: auto

  notify:
    runs-on: ubuntu-latest
    needs: [build-test-scan, deploy-staging, deploy-prod]
    if: always()
    steps:
      - name: Slack Notification for Staging
        if: github.ref == 'refs/heads/develop'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: Wizfi-Pipeline
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: "Staging Deployment Status"
          SLACK_MESSAGE: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Status: ${{ job.status }}
            Environment: Staging

      - name: Slack Notification for Production
        if: github.ref == 'refs/heads/main'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: Wizfi-Pipeline
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: "Production Deployment Status"
          SLACK_MESSAGE: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Status: ${{ job.status }}
            Environment: Production
